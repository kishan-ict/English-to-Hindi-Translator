<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English to Hindi Translator</title>
    <meta name="description" content="A clean, lightweight college semester project web application that translates text between English and Hindi, built with Python, HTML5, CSS3, and vanilla JavaScript designed for Cloudflare." />
    <meta property="og:title" content="English to Hindi Translator" />
    <meta property="og:description" content="A clean, lightweight college semester project web application that translates text between English and Hindi, built with Python, HTML5, CSS3, and vanilla JavaScript designed for Cloudflare." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="page-container">
      
      <!-- Minimal Header -->
      <header class="header">
        <h1 class="title">Text Translator</h1>
        <p class="subtitle">Simple English to Hindi Translation</p>
      </header>

      <!-- Notification / Error Message Banner -->
      <div id="status-banner" class="status-banner hidden" role="alert">
        <span id="status-text"></span>
        <button id="close-banner-btn" class="close-banner-btn" aria-label="Close message">&times;</button>
      </div>

      <!-- Main Translator Card -->
      <main class="translator-card">
        
        <!-- Input Panel (Source Language) -->
        <section class="panel input-panel">
          <div class="panel-header">
            <label for="source-lang" class="panel-label">From:</label>
            <select id="source-lang" class="language-select" aria-label="Source Language">
              <option value="en" selected>English</option>
              <option value="hi">Hindi</option>
            </select>
          </div>

          <div class="textarea-container">
            <textarea 
              id="input-text" 
              class="translation-textarea" 
              placeholder="Enter text to translate..." 
              maxlength="5000"
              rows="7"
              aria-label="Enter text to translate"
              autofocus
            ></textarea>
          </div>

          <div class="panel-footer">
            <span id="char-count" class="char-count">0 / 5000</span>
            <button id="clear-btn" type="button" class="btn btn-outline" title="Clear input text">
              Clear
            </button>
          </div>
        </section>

        <!-- Central Controls / Action Bar -->
        <div class="controls-divider">
          <button id="swap-btn" type="button" class="btn btn-swap" title="Swap Languages" aria-label="Swap Languages">
            <span class="swap-icon" aria-hidden="true">&#8646;</span>
            <span class="swap-label">Swap</span>
          </button>

          <button id="translate-btn" type="button" class="btn btn-primary">
            <span id="translate-btn-text">Translate</span>
          </button>
        </div>

        <!-- Output Panel (Target Language) -->
        <section class="panel output-panel">
          <div class="panel-header">
            <label for="target-lang" class="panel-label">To:</label>
            <select id="target-lang" class="language-select" aria-label="Target Language">
              <option value="hi" selected>Hindi</option>
              <option value="en">English</option>
            </select>
          </div>

          <div class="textarea-container">
            <textarea 
              id="output-text" 
              class="translation-textarea output-area" 
              placeholder="Your translation will appear here..." 
              readonly 
              rows="7"
              aria-label="Translated output text"
            ></textarea>
          </div>

          <div class="panel-footer">
            <div class="output-status" id="output-status"></div>
            <button id="copy-btn" type="button" class="btn btn-outline" title="Copy translation to clipboard">
              Copy
            </button>
          </div>
        </section>

      </main>

      <!-- Quick Click Preset Examples for Viva Demo -->
      <section class="quick-examples-container">
        <div class="examples-header">Click to test quick sentences:</div>
        <div class="example-chips-list">
          <button type="button" class="example-chip" data-sample="Hello">Hello</button>
          <button type="button" class="example-chip" data-sample="How are you?">How are you?</button>
          <button type="button" class="example-chip" data-sample="What is your name?">What is your name?</button>
          <button type="button" class="example-chip" data-sample="My name is Dhruvan">My name is Dhruvan</button>
          <button type="button" class="example-chip" data-sample="My favorite hobby is cricket">My hobby is cricket</button>
          <button type="button" class="example-chip" data-sample="Good morning">Good morning</button>
          <button type="button" class="example-chip" data-sample="Thank you">Thank you</button>
          <button type="button" class="example-chip" data-sample="India is my country">India is my country</button>
        </div>
      </section>

      <!-- Minimal Helpful Footer -->
      <footer class="footer">
        <p class="footer-tip">Keyboard shortcut: <strong>Ctrl + Enter</strong> to translate</p>
        <p class="footer-credit">College Semester Project &bull; Python Backend &bull; Cloudflare Architecture</p>
      </footer>

    </div>

    <!-- Vanilla JavaScript Interaction -->
    <script src="/script.js"></script>
  </body>
</html>
